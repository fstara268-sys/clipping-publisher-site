<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Authorization received</title><link rel="stylesheet" href="../style.css"></head><body><main>
<h1 id="t">Authorization</h1>
<p id="m">Loading…</p>
<p class="muted">Clipping Publisher · <a href="../privacy.html/">Privacy Policy</a></p>
<script>
var q=new URLSearchParams(location.search),t=document.getElementById('t'),m=document.getElementById('m');
if(q.get('code')){t.textContent='Authorization received';m.textContent='Copy the full address of this page from the address bar and send it back to complete the setup. The code works only once and expires in a few minutes.';}
else if(q.get('error')){t.textContent='Authorization not completed';m.textContent='TikTok returned: '+(q.get('error_description')||q.get('error'));}
else{m.textContent='This page is the return address of the Clipping Publisher authorization. Nothing to do here.';}
</script>
</main></body></html>
